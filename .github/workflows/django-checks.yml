name: Django checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: campus_delivery
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      DJANGO_SETTINGS_MODULE: campus_delivery.settings
      SECRET_KEY: ci-only-not-secret
      DEBUG: "True"
      DATABASE_NAME: campus_delivery
      DATABASE_USER: postgres
      DATABASE_PASSWORD: ci-only
      DATABASE_HOST: localhost
      DATABASE_PORT: "5432"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - name: Django system checks
        run: python manage.py check
      - name: Migrations apply cleanly
        run: python manage.py migrate --noinput
